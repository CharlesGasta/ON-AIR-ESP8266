name: Build ESP8266 firmware

on:
  push:
    branches: ["main"]
    paths:
      - "ON_AIR_ESP8266.ino"
      - ".github/workflows/build-firmware.yml"
  pull_request:
    paths:
      - "ON_AIR_ESP8266.ino"
      - ".github/workflows/build-firmware.yml"
  workflow_dispatch:

jobs:
  esp8266-firmware:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Test motion engine and configuration compatibility
        run: |
          git fetch --depth=1 origin efefbef61bba26bd57feaf1d220a7d36801d6897
          git fetch --depth=1 origin 9fd36bbb627346f8e6a70c49339bc49a015df8f1
          python3 tools/check-firmware.py
          python3 tools/check-motion.py
          python3 tools/check-ota.py

      - uses: arduino/setup-arduino-cli@v2

      - name: Install ESP8266 core
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://arduino.esp8266.com/stable/package_esp8266com_index.json
          arduino-cli core update-index
          arduino-cli core install esp8266:esp8266
          arduino-cli lib install "Adafruit NeoPixel"

      - name: Compile firmware
        run: |
          mkdir -p /tmp/ONAIR build
          cp ON_AIR_ESP8266.ino /tmp/ONAIR/ONAIR.ino

          arduino-cli compile \
            --fqbn esp8266:esp8266:nodemcuv2 \
            --output-dir "$GITHUB_WORKSPACE/build" \
            /tmp/ONAIR 2>&1 | tee build/compile.log
          python3 tools/check-memory.py build/compile.log

          cp ON_AIR_ESP8266.ino build/ON_AIR_ESP8266.ino
          cp build/ONAIR.ino.bin build/ON_AIR_ESP8266_OTA.bin

      - name: Upload source + OTA firmware
        uses: actions/upload-artifact@v4
        with:
          name: ON_AIR_ESP8266_OTA
          path: |
            build/ON_AIR_ESP8266.ino
            build/ON_AIR_ESP8266_OTA.bin
          if-no-files-found: error
